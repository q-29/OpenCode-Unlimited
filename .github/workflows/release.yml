name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tests
        run: npm test

      - name: build artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release.sh

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/OpenCode-Unlimited-$version.zip" \
            "dist/OpenCode-Unlimited-$version.tar.gz" \
            --title "$RELEASE_TAG" --generate-notes
