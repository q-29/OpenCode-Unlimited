name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node syntax
        run: |
          for f in plugins/*.js lib/*.js bin/opencode-unlimited; do
            node --check "$f"
          done

      - name: bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/release.sh

      - name: tests
        run: npm test

      - name: cli responds
        run: |
          chmod +x bin/opencode-unlimited install.sh
          ./bin/opencode-unlimited help
          ./bin/opencode-unlimited version
          ./bin/opencode-unlimited doctor
